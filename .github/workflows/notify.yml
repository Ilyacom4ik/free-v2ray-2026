name: Notify on FreeCFGHub1 update
on:
  push:
    branches:
      - main
    paths:
      - 'subscriptions/FreeCFGHub1.txt'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notify Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python - <<'EOF'
          import os, requests

          token = os.environ['TG_BOT_TOKEN']
          chat = os.environ['TG_CHAT_ID']

          text = "✔ Обновил подписки\n\n💬 По вопросам и проблемам: @FreeCFGHubMIX"

          requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={
                  "chat_id": chat,
                  "text": text,
                  "reply_markup": {
                      "inline_keyboard": [
                          [{"text": "✨ Поддержать канал", "url": "https://pay.cloudtips.ru/p/2486fa1a"}]
                      ]
                  }
              }
          )
          EOF
