name: Notify on FreeCFGHub1 update
on:
  push:
    branches:
      - main
    paths:
      - 'subscriptions/FreeCFGHub1.txt'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notify Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python - <<'EOF'
          import os, requests

          token = os.environ['TG_BOT_TOKEN']
          chat = os.environ['TG_CHAT_ID']

          try:
              with open('subscriptions/FreeCFGHub1.txt', 'r', encoding='utf-8') as f:
                  lines = [l.strip() for l in f if l.strip().startswith(('vless://', 'vmess://', 'trojan://', 'ss://'))]
              total = len(lines)
              lite = len([l for l in lines if 'Lite' in l])
              full = len([l for l in lines if 'Full' in l])
          except:
              total = lite = full = 0

          text = (
              f"🔄Обновление\n"
              f"Lite — {lite} | Full — {full}\n"
              f"🆕Подписки при бс👇\n"
              f"({total} ключей)\n"
              f"https://translate.yandex.ru/translate?url=https://raw.githubusercontent.com/Ilyacom4ik/free-v2ray-2026/refs/heads/main/subscriptions/FreeCFGHub1.txt\n"
              f"Все ключи\n"
              f"https://translate.yandex.ru/translate?url=https://raw.githubusercontent.com/Ilyacom4ik/vpn-keys/refs/heads/main/allkeysFreeCFGHub.txt\n"
              f"Старые ссылки остается в том же темпе:👇\n"
              f"https://raw.githubusercontent.com/Ilyacom4ik/free-v2ray-2026/refs/heads/main/subscriptions/FreeCFGHub1.txt\n"
              f"https://raw.githubusercontent.com/Ilyacom4ik/vpn-keys/refs/heads/main/allkeysFreeCFGHub.txt\n"
              f"(❌НЕ ДОБАВЛЯЙТЕ В КЛИЕНТЫ:Happ,v2raytun,incy\n"
              f"✅Лучше всего добавлять:V2rayNG,Exclave,Nekobox,Hiddify)\n"
              f"⚠️Внимание!! Все ключи были взяты из разных источников,а также с моего репозитория на гитхабе, ключи не являются собственностью моего канала\n"
              f"❗️Обновляйте подписку в своем клиенте\n"
              f"👍 или 👎❓"
          )

          requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={"chat_id": chat, "text": text}
          )
          EOF
